name: Unity iOS Builder

on:
  push:
    paths:
      - "games/**"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed-folders: ${{ steps.detect.outputs.changed-folders }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Detect changed folders
        id: detect
        run: |
          echo "Finding changed folders..."
          changed_folders=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | cut -d/ -f1-2 | sort -u)
          if [ -z "$changed_folders" ]; then
            echo "changed-folders=[]" >> $GITHUB_OUTPUT
          else
            json_array=$(echo "$changed_folders" | jq -R -s -c 'split("\n")[:-1]')
            echo "changed-folders=$json_array" >> $GITHUB_OUTPUT
          fi

  build-unity:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed-folders != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: ${{ fromJSON(needs.detect-changes.outputs.changed-folders) }}
    outputs:
      unity_version: ${{ steps.unity-version.outputs.unity_version }}
      ios_build_path: ${{ steps.export-path.outputs.ios_build_path }}
    steps:
      - uses: actions/checkout@v3

      - name: Extract Unity version
        id: unity-version
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          UNITY_VERSION=$(yq eval '.build.unity_version' ${{ matrix.folder }}/GameSpec.yaml)
          echo "unity_version=$UNITY_VERSION" >> $GITHUB_OUTPUT

      - name: Extract platform
        id: unity-platform
        run: |
          UNITY_PLATFORM=$(yq eval '.build.platform' ${{ matrix.folder }}/GameSpec.yaml)
          echo "unity_platform=$UNITY_PLATFORM" >> $GITHUB_OUTPUT

      - name: Build iOS with Unity
        if: contains(steps.unity-platform.outputs.unity_platform, 'ios')
        uses: game-ci/unity-builder@v4
        with:
          projectPath: ${{ matrix.folder }}
          targetPlatform: iOS
          unityVersion: ${{ steps.unity-version.outputs.unity_version }}
          allowDirtyBuild: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

      - name: Export build path
        id: export-path
        run: |
          echo "ios_build_path=${{ matrix.folder }}/build/iOS/iOS" >> $GITHUB_OUTPUT

  sign-and-export-ipa:
    needs: build-unity
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install certificate & provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build Xcode archive
        run: |
          xcodebuild \
            -scheme "I am Groot" \
            -archivePath $RUNNER_TEMP/iamgroot.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            -destination generic/platform=iOS \
            -project "${{ needs.build-unity.outputs.ios_build_path }}/Unity-iPhone.xcodeproj" \
            clean archive

      - name: Create ExportOptions.plist
        run: |
          EXPORT_OPTS_PATH=$RUNNER_TEMP/ExportOptions.plist
          cat > $EXPORT_OPTS_PATH <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <true/>
          </dict>
          </plist>
          EOF
          echo "ExportOptions.plist created at $EXPORT_OPTS_PATH"

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/iamgroot.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build

      # - name: Upload IPA Artifact
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: ios-ipa
      #     path: ${{ runner.temp }}/build/*.ipa
