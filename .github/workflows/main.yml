name: Unity iOS Builder

on:
  push:
    paths:
      - "games/**"

jobs:
  build-and-sign:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Detect changed folders
        id: detect
        run: |
          echo "Finding changed folders..."
          changed_folders=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | cut -d/ -f1-2 | sort -u)
          if [ -z "$changed_folders" ]; then
            echo "No changes detected"
            exit 0
          else
            echo "Changed folders: $changed_folders"
            # For simplicity, we'll process the first changed folder
            # You can modify this to handle multiple folders if needed
            FIRST_FOLDER=$(echo "$changed_folders" | head -n 1)
            echo "folder=$FIRST_FOLDER" >> $GITHUB_OUTPUT
          fi

      - name: Check if changes exist
        if: steps.detect.outputs.folder == ''
        run: |
          echo "No relevant changes detected. Exiting."
          exit 0

      - name: Install yq
        run: |
          brew install yq

      - name: Extract Unity version
        id: unity-version
        run: |
          UNITY_VERSION=$(yq eval '.build.unity_version' ${{ steps.detect.outputs.folder }}/GameSpec.yaml)
          echo "unity_version=$UNITY_VERSION" >> $GITHUB_OUTPUT
          echo "Unity version: $UNITY_VERSION"

      - name: Extract platform
        id: unity-platform
        run: |
          UNITY_PLATFORM=$(yq eval '.build.platform' ${{ steps.detect.outputs.folder }}/GameSpec.yaml)
          echo "unity_platform=$UNITY_PLATFORM" >> $GITHUB_OUTPUT
          echo "Unity platform: $UNITY_PLATFORM"

      - name: Check if iOS build is needed
        if: "!contains(steps.unity-platform.outputs.unity_platform, 'ios')"
        run: |
          echo "iOS platform not specified. Exiting."
          exit 0

      - name: Build iOS with Unity
        uses: game-ci/unity-builder@v4
        with:
          projectPath: ${{ steps.detect.outputs.folder }}
          targetPlatform: iOS
          unityVersion: ${{ steps.unity-version.outputs.unity_version }}
          allowDirtyBuild: true
        env:
          UNITY_EMAIL: support@anideebee.com
          UNITY_PASSWORD: Qwerty12!!
          UNITY_SERIAL: SC-RJ54-XRAS-DXGU-286W-Y38M

      - name: Install certificate & provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build Xcode archive
        run: |
          xcodebuild \
            -scheme "I am Groot" \
            -archivePath $RUNNER_TEMP/iamgroot.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            -destination generic/platform=iOS \
            -project "${{ steps.detect.outputs.folder }}/build/iOS/iOS/Unity-iPhone.xcodeproj" \
            clean archive

      - name: Create ExportOptions.plist
        run: |
          EXPORT_OPTS_PATH=$RUNNER_TEMP/ExportOptions.plist
          cat > $EXPORT_OPTS_PATH <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <true/>
          </dict>
          </plist>
          EOF
          echo "ExportOptions.plist created at $EXPORT_OPTS_PATH"

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/iamgroot.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build

      # - name: Upload IPA Artifact
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: ios-ipa-${{ steps.detect.outputs.folder }}
      #     path: ${{ runner.temp }}/build/*.ipa
